org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=true

# Kotlin incremental caches store relocatable paths. When the pub cache lives on a
# different Windows drive than the project (pub cache on C:, this repo on E:), closing
# the cache throws "this and base files have different roots" and every Kotlin plugin
# module fails with "Could not close incremental caches" / "Daemon compilation failed".
# Disabling incremental compilation is the standard workaround for that layout.
kotlin.incremental=false
